name: RedNotebook
options:
  bundleIdPrefix: com.helinergezen
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  RedNotebook:
    type: application
    platform: iOS
    sources: [RedNotebook]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.helinergezen.RedNotebook
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Red Notebook
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
