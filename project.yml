name: RedNotebook
options:
  bundleIdPrefix: com.helinergezen
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: TZ2X49FYC4
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  RedNotebook:
    type: application
    platform: iOS
    sources: [RedNotebook]
    dependencies:
      - target: NotebookWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.helinergezen.RedNotebook
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Ship the other cover colours as alternate icons
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        INFOPLIST_KEY_CFBundleDisplayName: "helin's"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSFaceIDUsageDescription: helin's uses Face ID to keep your notebook private.
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: helin's shows your calendar events in the agenda and can add new events you plan in the notebook.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"

  NotebookWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      # Shared with the app: theme, fonts, the Portuguese words and the grid paper
      - RedNotebook/Theme/Theme.swift
      - RedNotebook/Theme/CoverColor.swift
      - RedNotebook/Today/PortugueseWord.swift
      - RedNotebook/Calendar/PortugueseHolidays.swift
      - RedNotebook/Notebook/GridPaper.swift
      - path: RedNotebook/Resources/Fonts
        buildPhase: resources
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: "helin's"
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.helinergezen.RedNotebook.NotebookWidget
        TARGETED_DEVICE_FAMILY: "1"
